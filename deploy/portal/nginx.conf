# Include inside nginx's http block after configuring TLS certificates.
# Replace the example hostnames and certificate paths before deployment.
# Management is reachable only over a private network/VPN: keep the allowlist.
upstream new_api_management { server 127.0.0.1:3000; }
upstream new_api_portal { server 127.0.0.1:3001; }

server {
    listen 443 ssl;
    server_name console.example.com;
    ssl_certificate /etc/nginx/tls/console/fullchain.pem;
    ssl_certificate_key /etc/nginx/tls/console/privkey.pem;
    location / {
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_pass http://new_api_portal;
    }
}
server {
    listen 443 ssl;
    server_name admin.example.com;
    ssl_certificate /etc/nginx/tls/admin/fullchain.pem;
    ssl_certificate_key /etc/nginx/tls/admin/privkey.pem;
    allow 127.0.0.1;
    deny all;
    location / {
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_pass http://new_api_management;
    }
}
server {
    listen 443 ssl;
    server_name api.example.com;
    ssl_certificate /etc/nginx/tls/api/fullchain.pem;
    ssl_certificate_key /etc/nginx/tls/api/privkey.pem;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_buffering off;
    proxy_read_timeout 600s;
    # Official Tencent MPS SDK sends signed POST requests to the origin root.
    location = / {
        if ($request_method != POST) { return 404; }
        if ($http_x_tc_action !~ "^(Create|Describe)Aigc[A-Za-z]+Task$") { return 404; }
        proxy_pass http://new_api_management;
    }
    location ~ ^/(v1|tencentmps|tencenttokenhub)(/|$) {
        proxy_pass http://new_api_management;
    }
    # In particular, /api and management HTML/assets are never public here.
    location / { return 404; }
}
